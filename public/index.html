<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch The Cat - 圈住小猫</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --subtitle-color: #7f8c8d;
            --border-color: #e2e8f0;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --toggle-bg: #edf2f7;
            --toggle-border: #cbd5e0;
            --toggle-icon-color: #4a5568;
            --octo-bg: #151513;
            --octo-color: #fff;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --subtitle-color: #94a3b8;
            --border-color: #334155;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --toggle-bg: #334155;
            --toggle-border: #475569;
            --toggle-icon-color: #fbbf24;
            --octo-bg: #38bdf8;
            --octo-color: #0f172a;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding: 16px;
        }

        .header-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .title-group p {
            font-size: 0.875rem;
            color: var(--subtitle-color);
            margin-top: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn {
            background-color: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--toggle-icon-color);
            height: 44px;
            min-width: 44px;
            padding: 0 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .control-btn:hover {
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.active {
            background-color: #ff5722 !important;
            color: #ffffff !important;
            border-color: #ff5722 !important;
            box-shadow: 0 0 12px rgba(255, 87, 34, 0.45) !important;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .game-card {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--shadow-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        #catch-the-cat {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #catch-the-cat canvas {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
            display: block;
            touch-action: manipulation;
        }

        /* Responsive breakpoints for Phone and Pad */
        @media (max-width: 600px) {
            body {
                padding: 6px;
            }
            .header-container {
                margin-bottom: 10px;
                padding: 0 2px;
            }
            .title-group h1 {
                font-size: 1.25rem;
            }
            .title-group p {
                font-size: 0.75rem;
            }
            .game-card {
                padding: 4px;
                border-radius: 10px;
            }
            .control-btn {
                height: 38px;
                min-width: 38px;
                padding: 0 8px;
                border-radius: 10px;
                font-size: 0.75rem;
            }
            .control-btn svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>
    <script src="phaser.min.js"></script>
    <script src="catch-the-cat.js"></script>

    <div class="header-container">
        <div class="title-group">
            <h1>Catch The Cat</h1>
            <p>点击小圆点，围住小猫</p>
        </div>
        <div class="header-controls">
            <!-- Debug Route Toggle Button -->
            <button id="debug-toggle" class="control-btn" aria-label="切换逃跑路线显示" title="显示/隐藏最优逃跑路线">
                <svg viewBox="0 0 24 24">
                    <path d="M19 15.18V7a2 2 0 0 0-2-2H7.82l1.59-1.59L8 2 3 7l5 5 1.41-1.41L7.82 9H17v6.18A3 3 0 1 0 19 15.18zM6 19a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm12-2a1 1 0 1 1 1-1 1 1 0 0 1-1 1z"/>
                </svg>
                <span>路线</span>
            </button>
            <!-- Light/Dark Theme Toggle Button -->
            <button id="theme-toggle" class="control-btn" aria-label="切换明暗主题" title="切换明暗主题">
                <!-- Sun Icon (shown in dark mode to switch to light) -->
                <svg id="icon-sun" style="display: none;" viewBox="0 0 24 24">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
                <!-- Moon Icon (shown in light mode to switch to dark) -->
                <svg id="icon-moon" viewBox="0 0 24 24">
                    <path d="M12.3 2c.43 0 .77.35.7.78-.45 2.76.4 5.6 2.37 7.57 1.97 1.97 4.81 2.82 7.57 2.37.43-.07.78.27.78.7 0 5.25-4.25 9.5-9.5 9.5-5.25 0-9.5-4.25-9.5-9.5 0-5.25 4.25-9.5 9.5-9.5z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="game-card">
        <div id="catch-the-cat"></div>
    </div>

    <a href="https://github.com/ganlvtech/phaser-catch-the-cat" class="github-corner" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250" style="fill:var(--octo-bg); color:var(--octo-color); position: absolute; top: 0; border: 0; right: 0; transition: fill 0.3s ease;" aria-hidden="true"><path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path><path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path><path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path></svg>
    </a>
    <style>.github-corner:hover .octo-arm{animation:octocat-wave 560ms ease-in-out}@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}@media (max-width:500px){.github-corner:hover .octo-arm{animation:none}.github-corner .octo-arm{animation:octocat-wave 560ms ease-in-out}}</style>

    <script>
      (function() {
        var THEME_KEY = 'catch-the-cat-theme';
        var DEBUG_KEY = 'catch-the-cat-debug';

        var getSavedTheme = function() {
            var saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };

        var currentTheme = getSavedTheme();
        var isDebug = localStorage.getItem(DEBUG_KEY) === 'true';

        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            
            var sunIcon = document.getElementById('icon-sun');
            var moonIcon = document.getElementById('icon-moon');
            if (theme === 'dark') {
                if (sunIcon) sunIcon.style.display = 'block';
                if (moonIcon) moonIcon.style.display = 'none';
            } else {
                if (sunIcon) sunIcon.style.display = 'none';
                if (moonIcon) moonIcon.style.display = 'block';
            }

            if (window.game && typeof window.game.setTheme === 'function') {
                window.game.setTheme(theme);
            }
        }

        function applyDebug(enabled) {
            isDebug = enabled;
            localStorage.setItem(DEBUG_KEY, enabled ? 'true' : 'false');
            var btn = document.getElementById('debug-toggle');
            if (btn) {
                if (enabled) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
            if (window.game && typeof window.game.setDebug === 'function') {
                window.game.setDebug(enabled);
            }
        }

        applyTheme(currentTheme);

        window.game = new CatchTheCatGame({
            w: 11,
            h: 11,
            r: 20,
            initialWallCount: 8,
            backgroundColor: currentTheme === 'dark' ? 0x1e1e2d : 0xffffff,
            theme: currentTheme,
            debug: isDebug,
            parent: 'catch-the-cat',
            statusBarAlign: 'center',
            credit: 'github.com/ganlvtech'
        });

        if (isDebug) {
            applyDebug(true);
        }

        document.getElementById('theme-toggle').addEventListener('click', function() {
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        document.getElementById('debug-toggle').addEventListener('click', function() {
            applyDebug(!isDebug);
        });
      })();
    </script>
</body>
</html>
